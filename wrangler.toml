# Cloudflare Workers deploy for Merlinus (Next.js via OpenNext)
#
# `npm run build` runs Next.js then OpenNext (`build:opennext` → .open-next/).
# Deploy: `npm run deploy`  OR  `npm run build && npx wrangler deploy`
#
# Cloudflare dashboard build command should be: npm run build
# (Do not use plain `next build` alone — Wrangler needs .open-next/worker.js.)
#
# D1 binding name MUST stay `DB` (matches src/lib/d1.ts + PrismaD1(env.DB)).
#
# Migrations (not prisma migrate deploy):
#   npx wrangler d1 migrations apply merlinus-d1 --local
#   npx wrangler d1 migrations apply merlinus-d1 --remote

name = "merlinus-platform"
# OpenNext Worker entry (produced by `npm run build` / `build:opennext`)
main = ".open-next/worker.js"
compatibility_date = "2025-08-05"
# Wrangler v4: use nodejs_compat (legacy node_compat = true is rejected).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Workers Observability (dashboard logs + traces)
# P2-4: lower head sampling after full-capture audit window (cost/noise control).
# Raise temporarily to 1 for incident forensics, then return to 0.1.
# Must come after top-level Worker keys in TOML
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.1

# Static assets from the OpenNext build (not .vercel/output — that is Vercel-only)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Prisma / app code expects binding name "DB" (src/lib/d1.ts).
# Dashboard name may show as "apex"; uuid is authoritative.
[[d1_databases]]
binding = "DB"
database_name = "merlinus-d1"
database_id = "ebc1ac5c-c35c-464c-9e18-cf499c03ffba"
migrations_dir = "migrations"

# Self-reference required by OpenNext for some Next.js features
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "merlinus-platform"

# Object storage for images, video MPI, voice media (replaces Vercel Blob).
# Cloudflare R2 bucket names must be lowercase (API rejects "Apex" → use "apex").
[[r2_buckets]]
binding = "APEX_R2"
bucket_name = "apex"

# Distributed rate limiting — merlinus-rate-limit namespace (native Workers KV)
[[kv_namespaces]]
binding = "KV_STORE"
id = "95aae52266f74a31bf715071664b24b9"

# ---------------------------------------------------------------------------
# Durable Async AI — Cloudflare Queues (P1-1 durable path)
# Producer: OpenNext Worker sends jobs via env.AI_JOBS_QUEUE
# Consumer: workers/ai-jobs-consumer (or HTTP bridge → /api/queue/ai-consumer)
# Create queues once:
#   npx wrangler queues create merlinus-ai-jobs
#   npx wrangler queues create merlinus-ai-jobs-dlq
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "AI_JOBS_QUEUE"
queue = "merlinus-ai-jobs"

# Consumer is a companion Worker (workers/ai-jobs-consumer) — see that folder's wrangler.toml.
# Main OpenNext worker is producer-only so OpenNext fetch export is unchanged.

# ---------------------------------------------------------------------------
# Non-secret pilot / self-heal / billing flags (plain [vars] — ship on deploy)
# Secrets stay in the dashboard only: OPS_MAINTENANCE_SECRET, GROK_API_KEY,
# SESSION_SECRET, DATA_ENCRYPTION_KEY, SEARCH_HMAC_KEY, Sentry DSN if treated
# as secret, etc. Never put secrets in this file.
#
# You may already have set GROK_SELF_HEAL_* + MERLIN_MAINTENANCE_TZ in the
# dashboard — values here are the source of truth on the next wrangler deploy.
# ---------------------------------------------------------------------------
[vars]
# Self-heal + nightly window (America/New_York 8pm–6am; shrink later)
GROK_SELF_HEAL_ENABLED = "true"
GROK_SELF_HEAL_MODEL = "grok-3-mini"
MERLIN_MAINTENANCE_TZ = "America/New_York"
MERLIN_NIGHTLY_WINDOW_START = "20"
MERLIN_NIGHTLY_WINDOW_END = "6"
MERLIN_NIGHTLY_SOFT_MAINTENANCE = "true"
# National owner onboard HTTP provision (readiness gate still applies)
APEX_ALLOW_HTTP_PROVISION = "true"
# National owner billing estimate rates (cents; UI/ops only — not invoices)
BILLING_PLATFORM_MONTHLY_CENTS = "29900"
BILLING_STORY_FIRST_CENTS = "95"
BILLING_STORY_HIGH_VOLUME_CENTS = "65"
BILLING_HIGH_VOLUME_THRESHOLD = "400"
BILLING_STORY_REGEN_CENTS = "25"
BILLING_SMS_CENTS = "4"
BILLING_CURRENCY = "USD"
# Pilot export for GCP migration partners (token is a Secret: PILOT_EXPORT_TOKEN)
PILOT_EXPORT_ENABLED = "true"
